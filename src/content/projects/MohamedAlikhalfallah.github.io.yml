    ## 🚀 Projektstruktur

    In deinem Astro-Projekt findest du die folgenden Ordner und Dateien:

    ```text
    /
    ├── public/
    ├── src/
    │   └── pages/
    │       └── index.astro
    └── package.json
    ```

    Astro sucht im Verzeichnis `src/pages/` nach Dateien mit den Endungen `.astro` oder `.md`. Jede Seite wird basierend auf ihrem Dateinamen als Route bereitgestellt.

    Das Verzeichnis `src/components/` hat nichts Besonderes an sich, aber dort legen wir gerne alle Astro-/React-/Vue-/Svelte-/Preact-Komponenten ab.

    Alle statischen Assets, wie beispielsweise Bilder, können im Verzeichnis `public/` abgelegt werden.

    ## 🧞 Befehle

    Alle Befehle werden vom Stammverzeichnis des Projekts aus über ein Terminal ausgeführt:

    | Befehl | Aktion |
    | :------------------------ | :----------------------------------------------- |
    | `npm install` | Installiert Abhängigkeiten |
    | `npm run dev` | Startet den lokalen Entwicklungsserver unter `localhost:4321` |
    | `npm run build` | Erstellt deine Produktions-Website im Verzeichnis `./dist/` |
    | `npm run preview` | Zeigt eine lokale Vorschau des Builds vor der Bereitstellung an     |
    | `npm run astro ...` | Führt CLI-Befehle wie `astro add` und `astro check` aus |
    | `npm run astro -- --help` | Zeigt Hilfe zur Verwendung der Astro-CLI an |

    ## 👀 Möchtest du mehr erfahren?

    Schau dir gerne [unsere Dokumentation](https://docs.astro.build) an oder besuche unseren [Discord-Server](https://astro.build/chat).
