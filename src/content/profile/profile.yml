about:
  en: >-
    I hold a B.Sc. in Software Engineering from the University of Duisburg-Essen.
    I have built web applications end to end, from Angular and React frontends to
    Spring Boot REST APIs with authentication, databases and Docker. I also work on
    robotics with ROS 2 and on iOS: my bachelor thesis is a real-time occupancy
    mapping system that runs entirely on a LiDAR iPhone. I'm looking for a junior
    software engineering role where I can ship production software and keep growing
    in testing, CI/CD and clean architecture.
  de: >-
    Ich habe einen B.Sc. in Software Engineering an der Universität Duisburg-Essen.
    Ich habe Webanwendungen von Anfang bis Ende umgesetzt, von Angular- und
    React-Frontends bis zu Spring-Boot-REST-APIs mit Authentifizierung, Datenbanken
    und Docker. Außerdem arbeite ich an Robotik mit ROS 2 und an iOS: Meine
    Bachelorarbeit ist ein Echtzeit-System zur Belegungskartierung, das vollständig
    auf einem iPhone mit LiDAR läuft. Ich suche eine Junior-Stelle in der
    Softwareentwicklung, in der ich produktive Software ausliefere und mich in
    Testing, CI/CD und sauberer Architektur weiterentwickle.

