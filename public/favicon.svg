<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="12" fill="#0e1318"/>
    <!-- a 3×3 occupancy grid: free cells in teal, occupied cells in amber -->
    <g transform="translate(11 11)">
        <rect x="0"  y="0"  width="12" height="12" rx="2" fill="#f5b841"/>
        <rect x="15" y="0"  width="12" height="12" rx="2" fill="#f5b841"/>
        <rect x="30" y="0"  width="12" height="12" rx="2" fill="#f5b841"/>
        <rect x="0"  y="15" width="12" height="12" rx="2" fill="#f5b841"/>
        <rect x="15" y="15" width="12" height="12" rx="2" fill="#3fb8af" opacity="0.55"/>
        <rect x="30" y="15" width="12" height="12" rx="2" fill="#3fb8af" opacity="0.55"/>
        <rect x="0"  y="30" width="12" height="12" rx="2" fill="#f5b841"/>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#3fb8af" opacity="0.55"/>
        <rect x="30" y="30" width="12" height="12" rx="2" fill="#233039"/>
    </g>
</svg>